name: Auto Build and Deploy MVC to Somee

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Lay ma nguon tu GitHub
        uses: actions/checkout@v4

      - name: Cai dat moi truong .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build va dong goi project
        run: dotnet publish buoi12.sln -c Release -o ./publish

      - name: Tam dung web tren Somee de mo khoa file DLL
        run: |
          "<h1>Dang cap nhat he thong, vui long doi vai giay...</h1>" | Out-File -FilePath app_offline.htm -Encoding utf8
          curl.exe -T app_offline.htm -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/www.luongtuananh.somee.com/app_offline.htm"
          Start-Sleep -Seconds 5

      - name: Deploy code sang Somee qua FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./publish/
          server-dir: /www.luongtuananh.somee.com/

      - name: Mo lai web tren Somee
        if: always()
        run: |
          curl.exe -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/www.luongtuananh.somee.com/" -Q "-DELE app_offline.htm"
